<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>myform</title>
        <script>
            function displayImage() {
              var imageName = document.getElementById('imageName').value;
              document.getElementById('imageDisplay').src = imageName + 
              '.png';
            }
            </script>
    </head>
    <style>
        .Group{
            background-color:rgb(84, 40, 88);
            margin: 100px;
            font-style: italic;
        }
        .box {
             background-color: #dfa3d0;
             padding: 15px;
             border: 1px solid #d192ce;
             margin-bottom: 15px;
        }
    </style>
    <body  class="Group">
        <section class="box">
        <label for="imageName">Enter the name of the image:</label>
        <input type="text" id="imageName" name="imageName">
        <button onclick="displayImage()">Get Image</button>
        <br>
        <img id="imageDisplay" src="" alt="Image will be displayed here">
