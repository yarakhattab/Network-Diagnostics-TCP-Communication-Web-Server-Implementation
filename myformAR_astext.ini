    <head>
        <meta charset="utf-8">
        <title>الفورم الخاص بي</title>
        <script>
            function displayImage() {
              var imageName = document.getElementById('imageName').value;
              document.getElementById('imageDisplay').src = imageName + 
              '.png'; 
            }
            </script>
    </head>
    <style>
        .Group{
            background-color:rgb(84, 40, 88);
            margin: 100px;
            font-style: italic;
        }
        .box {
             background-color: #dfa3d0;
             padding: 15px;
             border: 1px solid #d192ce;
             margin-bottom: 15px;
        }
    </style>
    <body  class="Group">
        <section class="box">
            <label for="imageName">ادخل اسم الصورة التي تريد عرضها :</label>
            <input type="text" id="imageName" name="imageName">
            <button onclick="displayImage()">عرض الصورة</button>
            <br>
            <img id="imageDisplay" src="" alt="سوف تظهر الصورة هنا ">
            <h1>اصحاب الويب:</h1>
            <h2><b>المهندسة ميسر شملة</b></h2>
            <h2><b>المهندسة تالين بياتنة</b></h2>
